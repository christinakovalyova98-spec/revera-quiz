<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Personal Plan for Women 40+</title>
<meta name="description" content="A 2-minute quiz for women 40+ in perimenopause and menopause. Get your personal training plan.">
<meta name="theme-color" content="#FFF7F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1216" media="(prefers-color-scheme: dark)">
<style>
:root{
  --bg:#FFF7F2; --surface:#FFFFFF; --text:#26161E; --muted:#574650; --line:#E9D8D6;
  --accent:#B3264F; --accent-ink:#FFFFFF; --accent-soft:#FCE4EA; --accent-2:#F29E4C;
  --good:#2E7A57; --err:#B3261E;
  --z1:#F7D2C4; --z2:#F8E5B0; --z3:#C6E6D2;
  --pants:#4A2B3A; --shoe:#FFFFFF; --face:#3A2A2A; --lip:#B5646E;
  --shadow:0 6px 20px rgba(80,30,45,.08);
  --fs:18px; --fs-s:15px; --fs-h1:30px; --fs-h2:24px; --opt-h:54px; --gap:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1216; --surface:#281C22; --text:#F8EEF1; --muted:#D9C6CF; --line:#45343C;
    --accent:#FF86A8; --accent-ink:#1B1216; --accent-soft:#40232F; --accent-2:#F6B26B;
    --good:#7FD1A7; --err:#FF9C94; --z1:#5A3530; --z2:#57492A; --z3:#2F4E3D;
    --pants:#5B3A4A; --shoe:#E9DDE2; --face:#2A1A1E; --lip:#A94F5C;
    --shadow:0 6px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#1B1216; --surface:#281C22; --text:#F8EEF1; --muted:#D9C6CF; --line:#45343C;
  --accent:#FF86A8; --accent-ink:#1B1216; --accent-soft:#40232F; --accent-2:#F6B26B;
  --good:#7FD1A7; --err:#FF9C94; --z1:#5A3530; --z2:#57492A; --z3:#2F4E3D;
  --pants:#5B3A4A; --shoe:#E9DDE2; --face:#2A1A1E; --lip:#A94F5C;
  --shadow:0 6px 20px rgba(0,0,0,.35);
}
@media (max-height:700px){ :root{ --fs:16px; --fs-s:13.5px; --fs-h1:26px; --fs-h2:21px; --opt-h:48px; --gap:8px; } }
@media (max-height:600px){ :root{ --fs:15px; --fs-s:12.5px; --fs-h1:23px; --fs-h2:19px; --opt-h:44px; --gap:6px; } }

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:400 var(--fs)/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{text-wrap:balance}
p,li{text-wrap:pretty}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.app{max-width:480px;margin:0 auto;min-height:100%;height:100%;display:flex;flex-direction:column;padding:0 16px}
.app.wide{max-width:760px;height:auto}
header.top{flex:0 0 auto;padding:10px 0 6px;display:flex;flex-direction:column;gap:6px}
.toprow{display:flex;align-items:center;gap:10px;min-height:28px}
.back{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--text)}
.back[hidden]{visibility:hidden}
.back:focus-visible,.opt:focus-visible,.btn:focus-visible,.chip:focus-visible,.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.brand{font-weight:800;letter-spacing:.02em;font-size:15px;flex:1;text-align:center}
.brand span{color:var(--accent)}
.stepnum{font-size:var(--fs-s);color:var(--muted);min-width:32px;text-align:right;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
main{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;padding-bottom:12px}
.screen{flex:1;display:flex;flex-direction:column;min-height:0;animation:fadeIn .35s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.eyebrow{align-self:flex-start;background:var(--accent-soft);color:var(--text);font-weight:700;font-size:var(--fs-s);padding:5px 12px;border-radius:99px;margin:4px 0 8px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:var(--fs-h1);line-height:1.15;font-weight:700;letter-spacing:-.01em}
h1 .l{display:block}
h2{font-family:Georgia,"Times New Roman",serif;font-size:var(--fs-h2);line-height:1.2;font-weight:700;margin:6px 0 4px}
.sub{color:var(--muted);font-size:var(--fs-s);margin-top:2px}
.lead{color:var(--muted);margin-top:8px}
.lead .l{display:block}
.q{margin-top:8px}
.opts{display:flex;flex-direction:column;gap:var(--gap);margin-top:12px}
.opt{min-height:var(--opt-h);width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);opacity:0;animation:optIn .4s ease forwards;transition:transform .12s ease,border-color .2s,background .2s;line-height:1.25}
.opt:active{transform:scale(.98)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt .box{flex:0 0 22px;height:22px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center}
.opt.sel .box{background:var(--accent);border-color:var(--accent)}
.opt.sel .box::after{content:"";width:10px;height:6px;border:solid var(--accent-ink);border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) translate(1px,-1px)}
.opt .dot{flex:0 0 10px;height:10px;border-radius:50%;background:var(--accent-soft);border:2px solid var(--accent)}
.opt.sel .dot{background:var(--accent)}
@keyframes optIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.big .opt{justify-content:center;font-weight:700;font-size:calc(var(--fs) + 2px)}
.hero{flex:1 1 auto;min-height:0;max-height:230px;display:flex;justify-content:center;margin:8px 0 0}
.hero svg{height:100%;width:auto;max-width:100%}
.hero img{height:100%;min-height:0;width:auto;max-width:34%;object-fit:contain;margin:0 -2px;opacity:0;animation:optIn .5s ease forwards}
.hero img:nth-child(2){position:relative;z-index:1;animation-delay:.12s}.hero img:nth-child(3){animation-delay:.24s}
.fig{display:block;user-select:none;-webkit-user-drag:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);margin-top:12px;flex:1;min-height:0;max-height:420px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:6px 6px 8px;gap:2px;font-weight:700;box-shadow:var(--shadow);opacity:0;animation:optIn .4s ease forwards;min-height:0;overflow:hidden}
.card svg,.card img{flex:1;min-height:0;width:100%;object-fit:contain}
.card.sel{border-color:var(--accent);background:var(--accent-soft)}
.btn{display:block;width:100%;min-height:54px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:calc(var(--fs) + 1px);box-shadow:0 8px 20px rgba(179,38,79,.25);transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.45;box-shadow:none;cursor:not-allowed}
.footer{flex:0 0 auto;margin-top:16px}
.terms{font-size:12.5px;color:var(--muted);text-align:center;margin-top:8px}
/* aha */
.aha{gap:6px}
.aha .kicker{font-size:var(--fs-s);font-weight:800;color:var(--accent)}
.aha .viz{flex:0 1 auto;min-height:70px;max-height:190px;display:flex;align-items:center;justify-content:center;margin:6px 0}
.aha .viz svg{width:100%;height:100%;max-height:190px}
.aha p.small{font-size:var(--fs-s);color:var(--muted)}
.aha .strong{font-weight:800}
.src{font-size:12px;color:var(--muted);font-style:italic}
.bignum{font-family:Georgia,serif;font-size:calc(var(--fs-h1) * 1.8);font-weight:700;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
/* zones */
.zonewrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;margin:6px 0}
.zonewrap svg{height:100%;max-height:260px;width:auto}
.zfig{position:relative;height:100%;max-height:270px;aspect-ratio:303/760}
.zfig img{width:100%;height:100%}
.zhl{position:absolute;inset:0;background:var(--accent);-webkit-mask:var(--m) center/100% 100% no-repeat;mask:var(--m) center/100% 100% no-repeat;opacity:0;transition:opacity .3s;pointer-events:none}
.zhl.on{opacity:.6;animation:zp 1.8s ease-in-out infinite}
@keyframes zp{50%{opacity:.38}}
@media (prefers-reduced-motion:reduce){.zhl.on{animation:none}}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{min-height:44px;padding:8px 14px;border-radius:99px;background:var(--surface);border:2px solid var(--line);font-weight:600;font-size:var(--fs-s);opacity:0;animation:optIn .4s ease forwards}
.chip.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.zone-shape{fill:var(--accent);opacity:0;transition:opacity .3s}
.zone-shape.on{opacity:.5}
/* loader */
.loader{justify-content:center;gap:14px}
.ring{width:96px;height:96px;margin:0 auto}
.checks{list-style:none;display:flex;flex-direction:column;gap:10px}
.checks li{display:flex;gap:10px;align-items:center;opacity:.35;transition:opacity .3s}
.checks li.done{opacity:1}
.checks .tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;flex:0 0 24px}
.checks li.done .tick{background:var(--accent)}
.checks li.done .tick::after{content:"";width:9px;height:5px;border:solid var(--accent-ink);border-width:0 0 2.5px 2.5px;transform:rotate(-45deg)}
/* result */
.result{gap:8px}
.pcard{background:var(--surface);border:2px solid var(--accent);border-radius:18px;padding:10px 14px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow)}
.pcard>svg{flex:0 0 50px;height:50px}
.pcard .type{font-family:Georgia,serif;font-weight:700;font-size:calc(var(--fs) + 3px);line-height:1.15}
.pcard .tag{font-size:var(--fs-s);color:var(--muted);line-height:1.3}
.scoreline{display:flex;align-items:center;gap:8px;font-size:var(--fs-s);color:var(--muted);line-height:1.1}
.scoreline .sl{max-width:92px}
.scoreline b{font-family:Georgia,serif;font-size:calc(var(--fs) + 10px);color:var(--text);font-variant-numeric:tabular-nums}
.zonebadge{display:inline-block;white-space:nowrap;margin-left:auto;padding:3px 10px;border-radius:99px;font-weight:700;font-size:var(--fs-s);color:var(--text)}
.explain{font-size:var(--fs-s);line-height:1.35}
.gcard{background:var(--surface);border:2px solid var(--accent);border-radius:18px;padding:6px 14px;box-shadow:var(--shadow);margin-top:6px}
.gi{display:flex;gap:12px;align-items:center;padding:10px 0;opacity:0;animation:optIn .4s ease forwards}
.gi+.gi{border-top:1px solid var(--line)}
.gi .gic{flex:0 0 36px;height:36px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center}
.gi .k{font-size:12.5px;color:var(--muted);font-weight:600}
.gi b{display:block;line-height:1.25}
@media (max-height:600px){.gi{padding:6px 0}.gi .gic{flex-basis:30px;height:30px}}
.duo{display:flex;align-items:flex-end;justify-content:space-around;height:118px;flex:0 0 auto}
@media (max-height:700px){ .duo{height:96px} }
@media (max-height:600px){ .duo{height:74px} }
.duo figure{display:flex;flex-direction:column;align-items:center;height:100%}
.duo figure svg{flex:1;min-height:0;height:100%;width:auto}
.duo figcaption{font-size:12px;color:var(--muted);white-space:nowrap}
.duo figcaption b{color:var(--text)}
.duo .arrow{align-self:center;color:var(--accent);font-size:26px;font-weight:800}
.peek{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:6px 12px;font-size:var(--fs-s);position:relative;overflow:hidden}
.peek li{list-style:none;padding:2px 0}
.peek .blur{filter:blur(5px);user-select:none}
.peek .lock{position:absolute;right:10px;bottom:6px;font-size:12px;font-weight:700;color:var(--accent);background:var(--surface);padding:2px 8px;border-radius:99px}
.form{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.form label{font-weight:700;font-size:var(--fs-s)}
.input{min-height:50px;border-radius:12px;border:2px solid var(--line);padding:0 14px;font:inherit;background:var(--surface);color:var(--text);width:100%}
.input:focus{outline:none;border-color:var(--accent)}
.input.bad{border-color:var(--err)}
.err{color:var(--err);font-size:13px;font-weight:600}
.err:empty{display:none}
.row{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.row input{width:18px;height:18px;accent-color:var(--accent)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
@media (max-height:600px){
  .pcard{padding:6px 12px} .pcard>svg{flex-basis:40px;height:40px}
  .result{gap:5px} .input{min-height:44px} .btn{min-height:48px}
  .peek{padding:4px 12px} .peek li.blur{display:none} .form{gap:4px}
}
/* final page */
.fp{padding-bottom:110px}
.fp section{margin-top:36px}
.fp h3{font-family:Georgia,serif;font-size:calc(var(--fs) + 8px);margin-bottom:14px;line-height:1.2}
.ng{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:6px;margin-top:10px}
.ng figure{display:flex;flex-direction:column;align-items:center}
.ng figure svg,.ng figure img{height:220px;width:auto}
.ng figcaption{font-weight:700;font-size:var(--fs-s);color:var(--muted);margin-top:4px}
.ng .chev{align-self:center;font-size:40px;color:var(--accent);font-weight:800;opacity:.7}
.ngt{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:8px;background:var(--surface)}
.ngt>div{padding:12px 16px}
.ngt>div+div{border-left:1px solid var(--line)}
.ngt h4{text-align:center;font-size:var(--fs);margin-bottom:8px}
.ngt .k{font-size:13px;color:var(--muted);margin-top:6px}
.ngt .v{font-weight:800;color:var(--accent);font-size:calc(var(--fs) + 2px)}
.dash{display:flex;gap:4px;margin-top:4px}
.dash i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.dash i.on{background:var(--accent)}
.disc{font-size:11.5px;color:var(--muted);text-align:center;margin-top:8px}
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.tile .k{font-size:13px;color:var(--muted)}
.tile .v{font-weight:800;font-size:calc(var(--fs) + 2px);margin-top:2px}
.tile.w{grid-column:1/-1}
.srows{margin-top:10px;padding:4px 16px}
.sr{padding:12px 0;opacity:0;animation:optIn .4s ease forwards}
.sr+.sr{border-top:1px solid var(--line)}
.sr .k{display:block;font-size:13px;color:var(--muted)}
.sr b{display:block;font-size:calc(var(--fs) + 1px);line-height:1.3;margin-top:2px}
.sr .sx{display:block;font-size:var(--fs-s);color:var(--muted);margin-top:3px;line-height:1.4}
.sumout{margin-top:12px;background:var(--accent-soft);border-radius:16px;padding:16px;text-align:center}
.sumout p{line-height:1.45;margin-bottom:12px}
.sumout p b{display:block;font-family:Georgia,serif;font-size:calc(var(--fs) + 4px);margin-bottom:4px;text-wrap:balance}
.sumout .btn{max-width:360px;margin:0 auto}
.gauge{position:relative;height:12px;border-radius:99px;background:linear-gradient(90deg,var(--z1) 0 40%,var(--z2) 40% 70%,var(--z3) 70%);margin:14px 0 6px}
.gauge b{position:absolute;top:-7px;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:var(--accent);border:4px solid var(--surface);box-shadow:var(--shadow);transition:left 1.2s cubic-bezier(.2,.8,.2,1)}
.gl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.feat{display:flex;flex-direction:column;gap:14px}
.feat div{display:flex;gap:14px;align-items:flex-start}
.feat .ic{flex:0 0 46px;height:46px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center}
.feat b{display:block}
.feat span{font-size:var(--fs-s);color:var(--muted)}
.weeks{position:relative;border-radius:16px;overflow:hidden}
.wk{display:grid;grid-template-columns:28px repeat(7,minmax(40px,1fr));gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:8px}
.wk .wl{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12.5px;color:var(--muted);text-align:center;font-weight:700}
.wk .d{background:var(--bg);border-radius:10px;padding:6px 1px;text-align:center;font-size:11px;line-height:1.25;overflow-wrap:normal}
.wk .d i{display:block;font-style:normal;white-space:nowrap}
@media (max-width:420px){.wk{gap:3px;padding:6px}.wk .d{font-size:9.5px;letter-spacing:-.2px}}
.wk .d b{display:block;font-size:12.5px}
.wk.blur{filter:blur(4px);opacity:.7}
.weeks .over{position:absolute;right:-6px;bottom:0;height:88%;pointer-events:none}
.weeks .over img{height:100%;width:auto}
.goals{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;list-style:none}
.goals li{position:relative;padding-left:30px;font-size:var(--fs-s)}
.goals li::before{content:"";position:absolute;left:0;top:0;width:20px;height:20px;border-radius:50%;border:2px solid var(--accent)}
.goals li::after{content:"";position:absolute;left:6px;top:5px;width:8px;height:5px;border:solid var(--accent);border-width:0 0 2px 2px;transform:rotate(-45deg)}
.laurel{display:flex;align-items:center;justify-content:center;gap:10px;text-align:center}
.laurel .n{font-size:calc(var(--fs) + 10px);font-weight:800;font-family:Georgia,serif;line-height:1.15}
.laurel .t{max-width:260px;margin:4px auto 0}
.laurel .t{font-size:var(--fs-s);color:var(--muted)}
.rating{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;margin:12px auto 0;max-width:420px;font-size:13px;color:var(--muted)}
.rating .stars{color:var(--accent-2);font-size:18px;letter-spacing:2px}
.rating b{color:var(--accent)}
.ratingnote{text-align:center;font-weight:800;margin-top:12px}
.plans{display:flex;flex-direction:column;gap:12px}
.plan{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;text-align:left;width:100%;gap:10px}
.plan.sel{border-color:var(--accent);background:var(--accent-soft)}
.plan .radio{flex:0 0 22px;height:22px;border-radius:50%;border:2px solid var(--muted)}
.plan.sel .radio{border:7px solid var(--accent)}
.plan .pmain{flex:1}
.plan .pname{font-weight:800}
.plan .pprice{font-size:var(--fs-s);color:var(--muted)}
.plan .pday{text-align:right;font-weight:800;font-size:calc(var(--fs) + 6px)}
.plan .pday small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.plan .badge{position:absolute;top:-11px;left:14px;background:var(--accent);color:var(--accent-ink);font-size:11.5px;font-weight:800;padding:2px 10px;border-radius:99px}
.fine{font-size:12.5px;color:var(--muted);margin-top:10px}
.checklist{list-style:none}
.checklist li{padding:5px 0 5px 30px;position:relative}
.checklist li::before{content:"";position:absolute;left:6px;top:11px;width:12px;height:7px;border:solid var(--good);border-width:0 0 3px 3px;transform:rotate(-45deg)}
.revs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:thin}
.rev{flex:0 0 min(290px,82%);scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;font-size:var(--fs-s)}
.rev .who{display:flex;align-items:center;gap:10px;font-weight:800}
.rev .who i{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-style:normal;color:var(--accent)}
.rev .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
.rev .stars{color:var(--accent-2);letter-spacing:1px}
.rev .ver{font-size:11.5px;color:var(--good);font-weight:800}
.helped{text-align:center;margin-bottom:14px}
.helped .n{font-size:calc(var(--fs) + 18px);font-weight:800;display:block}
.faq details{background:var(--surface);border-radius:12px;padding:12px 14px;margin-bottom:8px;border:1px solid var(--line)}
.faq summary{font-weight:700;cursor:pointer}
.faq p{margin-top:6px;font-size:var(--fs-s);color:var(--muted)}
.fab.off{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(20px)}
.fab{transition:opacity .25s,transform .25s;position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(420px,calc(100% - 32px));z-index:20;animation:pulse 2.2s ease-in-out infinite}
.fab .btn{display:flex;align-items:center;justify-content:center;gap:10px}
@keyframes pulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.035)}}
.toast{margin-top:10px;font-size:var(--fs-s);color:var(--good);font-weight:700;text-align:center}
@media (min-width:700px){ .ng figure svg,.ng figure img{height:300px} }
@media (max-width:420px){ .ng figure svg,.ng figure img{height:200px} .goals{grid-template-columns:1fr} }
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

    byAge:{
      '40-49':{l1:'By your 50s, your body will need about 200 fewer calories a day to stay at the same weight. The reason: we slowly lose muscle with age, and muscle is what uses energy.', l2:'Without a change, women gain about 0.7 kg a year in their 50s, often around the [zone].', out:'Start now and you’re ahead of it. Strong muscles are the answer, not eating less.', from:'Today', to:'Your 50s', kg:true},

  { id:'desires', type:'multi', step:10,

/* =====================================================================
   Engine
   ===================================================================== */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const F = id => FLOW.find(x=>x.id===id);
const state = { answers:{}, idx:0, history:[], email:'', optin:false, plan:null };
const main=$('#main'), bar=$('#bar'), stepnum=$('#stepnum'), backBtn=$('#back');

function opt(id,v){ return F(id).options.find(o=>o.v===v); }
function firstSel(id){ const a=state.answers[id]||[]; const o=F(id).options.find(x=>a.includes(x.v)); return o||null; }
function zoneOpt(){ return firstSel('zones') || opt('zones','waist'); }
function timeOpt(){ return state.answers.time ? opt('time',state.answers.time) : opt('time','15'); }
function fill(s){ const t=timeOpt(); return s.replace(/\[zone\]/g, zoneOpt().word).replace(/\[focus\]/g, zoneOpt().focus).replace(/\[plan\]/g, t.plan).replace(/\[lo\]/g, t.lo); }
function shapeK(){ const s=state.answers.shape; return s? opt('shape',s).k : 1; }
const SHAPE_IMG=['img/shape-1.webp','img/shape-2.webp','img/shape-3.webp','img/shape-4.webp'], FIT_IMG='img/shape-fit.webp';
function goalImg(k){ return k>=2 ? SHAPE_IMG[k-1] : FIT_IMG; }  // 4→3, 3→2, 2→fit, 1→fit
function figImg(src, alt=''){ return `<img class="fig" src="${src}" alt="${esc(alt)}" draggable="false" decoding="async">`; }
// zone rectangles in % of the figure box [x0,y0,x1,y1]; the highlight is clipped to the silhouette via mask
const ZR=[
  {arms:[[15,19,31,56],[69,19,85,56]], waist:[[32,33,70,47]], hips:[[27,47,76,72]]},
  {arms:[[11,19,29,56],[71,19,89,56]], waist:[[29,33,73,47]], hips:[[22,47,81,72]]},
  {arms:[[9,19,27,56],[73,19,91,56]],  waist:[[27,33,75,47]], hips:[[22,47,82,72]]},
  {arms:[[1,19,24,57],[77,19,99,57]],  waist:[[23,33,78,47]], hips:[[15,47,87,72]]} ];
function zoneFig(k){
  const src=SHAPE_IMG[k], z={...ZR[k], back:[[0,16,100,33]], full:[[0,14,100,97]]};
  let h=''; for(const key in z) z[key].forEach(r=>{ h+=`<div class="zhl" data-z="${key}" style="--m:url('${src}');clip-path:inset(${r[1]}% ${100-r[2]}% ${100-r[3]}% ${r[0]}%)"></div>`; });
  return `<div class="zfig">${figImg(src)}${h}</div>`;
}
function ageKey(){ return state.answers.age || '50-59'; }

function compute(a=state.answers){
  const actSel=(a.activity||[]).map(v=>opt('activity',v));
  const act = actSel.length ? Math.max(...actSel.map(o=>o.pts)) : 7;
  const rec = a.recent? opt('recent',a.recent).pts : 7;
  const bl = a.barriers||[];
  const barPts = bl.includes('nothing') ? 30 : Math.max(6, 30 - 6*bl.length);
  const score = act + rec + barPts;
  const R = F('result');
  const zone = R.zones.find(z=>score>=z.min && score<=z.max);
  const forecast = Math.round(score + 0.6*(100-score));
  const shares=[['activity',act/35],['recent',rec/35],['barriers',barPts/30]];
  let best=shares[0]; shares.forEach(s=>{ if(s[1]>best[1]) best=s; });
  const strength = best[1] < 0.3 ? R.strengths.none : R.strengths[best[0]];
  const B=F('barriers'); const top=B.priority.find(p=>bl.includes(p));
  let hold, first;
  if(top){ const o=opt('barriers',top); hold=o.hold; first=o.first; }
  else { const low=(act/35 <= rec/35)?'activity':'recent'; hold=R.axisHold[low].hold; first=R.axisHold[low].first; }
  const r=(a.reason||[]); const reasonO=F('reason').options.find(o=>r.includes(o.v));
  const typeKey = reasonO ? reasonO.type : 'rule';
  const type = R.types[typeKey];
  const d=(a.desires||[]).map(v=>{ const o=opt('desires',v); return o.goal||o.label.toLowerCase(); });
  const desire = d.length ? d.slice(0,2).join(' and ') : 'feeling like yourself again';
  const does = actSel.length ? actSel.slice(0,2).map(o=>o.does).join(' and ') : '';
  return {score, act, rec, bar:barPts, zone, forecast, strength, hold, first:fill(first), type, typeKey, desire, does, topBarrier:top||null, reason:reasonO?reasonO.v:'changed'};
}

const SEQ = FLOW.map(x=>x.id);
[...SHAPE_IMG, FIT_IMG].forEach(src=>{ const i=new Image(); i.src=src; });

function setTop(scr){
  const isFinal = scr.id==='final';
  $('#top').style.display = isFinal ? 'none' : '';
  const step = scr.step || scr.afterStep || TOTAL_STEPS;
  const done = scr.id==='result';
  bar.style.width = (done?100:Math.round(step/TOTAL_STEPS*100))+'%';
  $('#barwrap').setAttribute('aria-valuenow', step);
  stepnum.textContent = done ? '' : `${step}/${TOTAL_STEPS}`;
  stepnum.setAttribute('data-step', step);
  backBtn.hidden = state.history.length===0 || ['loader','result'].includes(scr.id);
}
function go(id, push=true){ if(push) state.history.push(state.idx); state.idx=SEQ.indexOf(id); render(); }
function next(){ go(SEQ[state.idx+1]); }
backBtn.addEventListener('click',()=>{ if(!state.history.length) return; state.idx=state.history.pop(); render(); });

function render(){
  const scr = FLOW[state.idx];
  $('#app').classList.toggle('wide', scr.id==='final');
  setTop(scr);
  main.innerHTML='';
  document.querySelectorAll('.fab').forEach(x=>x.remove());
  const el=document.createElement('section'); el.className='screen'; el.dataset.screen=scr.id; main.appendChild(el);
  window.scrollTo(0,0);
  ({single:renderSingle, multi:renderMulti, cards:renderCards, zones:renderZones, aha:renderAha, loader:renderLoader, result:renderResult, final:renderFinal})[scr.type](scr, el);
}

function headHTML(scr){
  if(scr.landing){
    return `<span class="eyebrow">${esc(scr.eyebrow)}</span><h1>${scr.titleLines.map(l=>`<span class="l">${esc(l)}</span>`).join('')}</h1><p class="lead">${scr.subLines.map(l=>`<span class="l">${esc(l)}</span>`).join('')}</p><div class="hero">${figImg(SHAPE_IMG[1])}${figImg(SHAPE_IMG[2])}${figImg(SHAPE_IMG[3])}</div><h2 class="q">${esc(scr.question)}</h2>`;
  }
  return `<h2>${esc(scr.question)}</h2>${scr.sub?`<p class="sub">${esc(scr.sub)}</p>`:''}`;
}

function renderSingle(scr, el){
  el.innerHTML = headHTML(scr) + `<div class="opts ${scr.big?'big':''}" role="radiogroup"></div>` + (scr.terms?`<p class="terms">${esc(scr.terms)}</p>`:'');
  const box=$('.opts',el);
  scr.options.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt'+(state.answers[scr.id]===o.v?' sel':''); b.style.animationDelay=(i*70)+'ms';
    b.setAttribute('role','radio'); b.dataset.v=o.v;
    b.innerHTML = scr.big? esc(o.label) : `<span class="dot"></span><span>${esc(o.label)}</span>`;
    b.addEventListener('click',()=>{ state.answers[scr.id]=o.v; box.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b)); setTimeout(next,380); });
    box.appendChild(b);
  });
}

function renderMulti(scr, el){
  const sel=new Set(state.answers[scr.id]||[]);
  el.innerHTML = headHTML(scr) + `<div class="opts"></div><div class="footer"><button class="btn" data-testid="continue">Continue</button></div>`;
  const box=$('.opts',el), cta=$('.btn',el);
  const sync=()=>{ box.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',sel.has(x.dataset.v))); cta.disabled=sel.size===0; };
  scr.options.forEach((o,i)=>{
    const b=document.createElement('button'); b.className='opt'; b.dataset.v=o.v; b.style.animationDelay=(i*60)+'ms'; b.setAttribute('role','checkbox');
    b.innerHTML=`<span class="box"></span><span>${esc(o.label)}</span>`;
    b.addEventListener('click',()=>{
      if(sel.has(o.v)) sel.delete(o.v);
      else { if(scr.exclusive){ if(o.v===scr.exclusive) sel.clear(); else sel.delete(scr.exclusive); } sel.add(o.v); }
      sync();
    });
    box.appendChild(b);
  });
  sync();
  cta.addEventListener('click',()=>{ state.answers[scr.id]=[...sel]; next(); });
}

function renderZones(scr, el){

  el.innerHTML = headHTML(scr) + `<div class="zonewrap">${zoneFig(shapeK())}</div><div class="chips"></div><div class="footer"><button class="btn" data-testid="continue">Continue</button></div>`;
  const chips=$('.chips',el), cta=$('.btn',el);
  const sync=()=>{ chips.querySelectorAll('.chip').forEach(c=>c.classList.toggle('sel',sel.has(c.dataset.v))); el.querySelectorAll('.zhl').forEach(z=>z.classList.toggle('on',sel.has(z.dataset.z))); cta.disabled=sel.size===0; };
  scr.options.forEach((o,i)=>{
    const c=document.createElement('button'); c.className='chip'; c.dataset.v=o.v; c.textContent=o.label; c.style.animationDelay=(i*60)+'ms';

function renderAha(scr, el){
  el.classList.add('aha');

    const rl=scr.reasonLine[c.reason];
    h+=`<p class="kicker">${esc(sl[0])}</p><h2>${esc(sl[1])}</h2>`;
    if(rl.pct){

    } else {

/* ---------- helpers ---------- */
function buildSummary(c){
  const a=state.answers, acts=a.activity||[], t=timeOpt();
  const stW=opt('stage',a.stage||'unsure').words;
  const stageIn = a.stage==='post' ? 'after menopause' : 'in '+stW;
  const fresh = acts.length===0 || (acts.length===1 && acts[0]==='inactive');
  const hasStr = acts.includes('strength') || acts.includes('mix');
  const dv = acts.map(v=>opt('activity',v).dv).filter(Boolean).slice(0,2).join(' and ');
  const where = fresh ? ["A fresh start", "No old habits to undo, so we start with the right ones."]
    : [cap(c.does), hasStr ? "That's a real base. We'll build on it, not replace it." : "That's a solid base for your heart and mood. We'll build on it."];
  let gap;
  if(fresh || !hasStr) gap=['Regular strength work', `It's what keeps your muscles and bones strong ${stageIn}.`];
  else if(c.rec<26) gap=['A steady rhythm', `Strength work pays off ${stageIn} when it's regular, not occasional.`];
  else gap=['Training built for this stage', `Smarter recovery and joint-friendly progressions ${stageIn}.`];
  const fix={joints:'Every move is joint-friendly, no jumping.', tired:'Short sessions, plus a 5‑minute version for low days.', time:`It fits into ${t.plan} minutes, at home.`, dunno:'Every move is explained, step by step.', hard:'It starts easy and builds up with you.', motivation:'Short sessions and progress you can see.'};
  const held = c.topBarrier ? [cap(c.hold), 'So in your plan: '+fix[c.topBarrier].charAt(0).toLowerCase()+fix[c.topBarrier].slice(1)]
                            : [cap(c.hold), ''];
  return {
    rows:[ ['Where you are', where[0], where[1]], ["What's missing", gap[0], gap[1]], ["What's held you back", held[0], held[1]], ['Your first step this week', c.first, ''] ],
    outHead: "You don't need a harder plan. You need a clear one.",
    outText: `2–3 strength sessions a week, ${t.plan} minutes a day, built for ${stW}. Your path to ${((a.desires||[]).length? opt('desires',a.desires[0]).goal : 'feeling like yourself again')}.`
  };
}
function cap(s){ return s? s.charAt(0).toUpperCase()+s.slice(1) : s; }
function planPeek(){
  const t=timeOpt(), joints=(state.answers.barriers||[]).includes('joints');
  const d1 = ageKey()==='60+' ? `${t.lo}-minute gentle strength and balance, no jumping` : `${t.lo}-minute gentle strength, no jumping`;
  const d2 = joints ? '10-minute brisk walk + stretches for stiff mornings' : '10-minute brisk walk + easy stretches';
  return [d1,d2];
}
function countUp(node,to,suffix){ const t0=performance.now(),dur=1100; const tick=t=>{const k=Math.min(1,(t-t0)/dur); node.textContent=Math.round(to*(1-Math.pow(1-k,3)))+suffix; if(k<1) requestAnimationFrame(tick);}; requestAnimationFrame(tick); }

function submitLead(c, hp){
  const a=state.answers, L=(id,v)=>{const o=opt(id,v); return o?o.label:v;};
  const payload={ email:state.email, optin:state.optin, website:hp||'',
    answers:{ age:L('age',a.age), stage:L('stage',a.stage), reason:(a.reason||[]).map(v=>L('reason',v)), activity:(a.activity||[]).map(v=>L('activity',v)),
      shape:L('shape',a.shape), zones:(a.zones||[]).map(v=>L('zones',v)), recent:L('recent',a.recent), time:L('time',a.time),
      barriers:(a.barriers||[]).map(v=>L('barriers',v)), desires:(a.desires||[]).map(v=>L('desires',v)) },
    score:c.score, zone:c.zone.name, type:c.type.name, strength:c.strength, weakness:c.hold, firstStep:c.first,
    completedAt:new Date().toISOString(), tz:Intl.DateTimeFormat().resolvedOptions().timeZone };
  try{ fetch('api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),keepalive:true}).catch(()=>{}); }catch(e){}
}

  const legs=`<path d="M${cx-W-1} 116 L${cx+W+1} 116 Q${cx+H+2} 126 ${cx+H} 140 Q${cx+H-2} 170 ${cx+T+3} 200 L${cx+8+k} 226 L${cx+3} 226 L${cx+1} 160 Q${cx} 155 ${cx-1} 160 L${cx-3} 226 L${cx-8-k} 226 L${cx-T-3} 200 Q${cx-H+2} 170 ${cx-H} 140 Q${cx-H-2} 126 ${cx-W-1} 116Z" fill="var(--pants)"/>`;
  const shoes=`<ellipse cx="${cx-6-k*0.5}" cy="229" rx="8" ry="4.5" fill="var(--shoe)" stroke="var(--line)"/><ellipse cx="${cx+6+k*0.5}" cy="229" rx="8" ry="4.5" fill="var(--shoe)" stroke="var(--line)"/>`;
  const shoulders=`<path d="M${cx-S} 64 Q${cx} 52 ${cx+S} 64 L${cx+S-2} 80 L${cx-S+2} 80Z" fill="${skin}"/>`;
  const tank=`<path d="M${cx-S+7} 58 Q${cx} 72 ${cx+S-7} 58 L${cx+S-1} 64 Q${cx+S+1} 76 ${cx+S-2} 86 Q${cx+W+3} 100 ${cx+W+1} 118 L${cx-W-1} 118 Q${cx-W-3} 100 ${cx-S+2} 86 Q${cx-S-1} 76 ${cx-S+1} 64Z" fill="${top}"/>`;
  const neck=`<rect x="${cx-5}" y="42" width="10" height="16" rx="4" fill="${skin}"/>`;
  const head=`<circle cx="${cx}" cy="31" r="15" fill="${skin}"/>`;
  const face=`<circle cx="54.5" cy="31" r="1.7" fill="var(--face)"/><circle cx="65.5" cy="31" r="1.7" fill="var(--face)"/><circle cx="51.5" cy="36.5" r="2.6" fill="#F28D8D" opacity=".35"/><circle cx="68.5" cy="36.5" r="2.6" fill="#F28D8D" opacity=".35"/><path d="M${o.goal?'54.5 37 Q60 43 65.5 37':'55.5 38 Q60 41.5 64.5 38'}" stroke="var(--lip)" stroke-width="1.7" fill="none" stroke-linecap="round"/>`;

  if(o.zones){

      <ellipse class="zone-shape" data-z="arms" cx="${cx-(S+5+k*0.8)}" cy="102" rx="${6+k}" ry="24"/><ellipse class="zone-shape" data-z="arms" cx="${cx+(S+5+k*0.8)}" cy="102" rx="${6+k}" ry="24"/>
      <ellipse class="zone-shape" data-z="waist" cx="${cx}" cy="108" rx="${W+4}" ry="11"/>
      <ellipse class="zone-shape" data-z="hips" cx="${cx}" cy="142" rx="${H+3}" ry="14"/>
      <rect class="zone-shape" data-z="back" x="${cx-S+3}" y="60" width="${2*S-6}" height="24" rx="10"/>`;
  }
  return `<g>${hairBack}${arm(-1)}${arm(1)}${legs}${shoes}${neck}${shoulders}${tank}${head}${face}${hairFront}${zones}</g>`;
}
function womanSVG(o){ return `<svg viewBox="${o.vb||'0 0 120 240'}" aria-hidden="true" preserveAspectRatio="xMidYMax meet">${woman(o)}</svg>`; }

}
function peopleSVG(n){

function minutesSVG(t){

    <text x="20" y="9" font-size="12" font-weight="800" fill="var(--text)" opacity="0">Your plan: ${lbl}<animate attributeName="opacity" to="1" dur=".3s" begin="1.2s" fill="freeze"/></text>

function laurel(flip){
